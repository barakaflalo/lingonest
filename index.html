<!DOCTYPE html>
<html lang="he" dir="rtl" data-theme="gold" data-mode="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' https://generativelanguage.googleapis.com https://api.anthropic.com https://api.openai.com http://localhost:11434; object-src 'none'; base-uri 'none'; manifest-src 'self'; worker-src 'self'; form-action 'none'">
<title>LingoNest</title>
<meta name="description" content="LingoNest — ללמוד לדבר, בכל מקום. אותיות, מילים ומשפטים לטיול באנגלית, ספרדית, רוסית, ערבית ותאית, עם הקראה בקול.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="LingoNest · AppNest">
<meta property="og:description" content="ללמוד לדבר, בכל מקום">
<meta property="og:image" content="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Noto+Serif:wght@500;700&family=Noto+Serif+Thai:wght@500;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* ===== LingoNest — style.css ===== */
:root{--r:14px;--r2:22px;--ui:'Assistant','Segoe UI',system-ui,-apple-system,'Noto Sans Hebrew',Arial,sans-serif;
  --script:'Noto Serif','Noto Serif Thai','Noto Naskh Arabic','Times New Roman',serif}
:root[data-theme=gold]{--accN:#D4AF37;--accD:#8A6A12;--bgN:#000000;--sfN:#100E08}
:root[data-theme=sapphire]{--accN:#8FB4E8;--accD:#1F4E8C;--bgN:#02060F;--sfN:#0A1222}
:root[data-theme=emerald]{--accN:#4FC39A;--accD:#0E6B4B;--bgN:#010A06;--sfN:#07170F}
:root[data-theme=wine]{--accN:#E29AA8;--accD:#8C2A3E;--bgN:#0A0205;--sfN:#1A0A10}
:root[data-theme=copper]{--accN:#E0955A;--accD:#93501C;--bgN:#0A0502;--sfN:#1A0F07}
:root[data-mode=night]{--bg:var(--bgN);--sf:var(--sfN);--tx:#F3EFE6;--mu:#A9A294;--acc:var(--accN);--on:#000;--bd:color-mix(in srgb,var(--accN) 38%,transparent);--ok:#56C98A;--no:#F07167}
:root[data-mode=day]{--bg:#F6F5F1;--sf:#FFFFFF;--tx:#17150F;--mu:#5E5A50;--acc:var(--accD);--on:#fff;--bd:color-mix(in srgb,var(--accD) 40%,transparent);--ok:#1E8E4F;--no:#C0392B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}
.skip{position:absolute;inset-inline-start:-999px;top:0;background:var(--acc);color:var(--on);padding:8px 14px;z-index:99}
.skip:focus{inset-inline-start:8px}
#app{max-width:560px;margin:0 auto;padding:14px 16px 90px}
#app.enter{animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* top / header */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{display:block;font-size:1.25rem;letter-spacing:.02em}
.brand small{display:block;color:var(--mu);font-size:.8rem;margin-top:-3px}
.logo{display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--acc);border-radius:12px;color:var(--acc);font-size:1.3rem}
.logo.big{width:72px;height:72px;font-size:2.2rem;margin:0 auto 8px;border-radius:20px}
.tools{display:flex;align-items:center;gap:4px}
.ic{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:transparent;cursor:pointer;font-size:1.15rem;display:inline-grid;place-items:center;padding:0 8px}
.ic:hover{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.ic.xl{min-width:64px;height:64px;font-size:1.7rem;border-radius:18px}
.dot{width:14px;height:14px;border-radius:50%;border:0;background:var(--no);cursor:pointer;margin:0 8px;box-shadow:0 0 0 3px color-mix(in srgb,var(--no) 25%,transparent)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.dot.inl{display:inline-block;margin:0 6px;vertical-align:middle;cursor:default}
.hello{color:var(--mu);margin:14px 0 8px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.bar h2{flex:1;margin:0;font-size:1.15rem;outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:1.5px solid var(--acc);color:var(--acc);background:transparent;border-radius:12px;height:46px;padding:0 16px;font-weight:700;cursor:pointer;flex-shrink:0}
.back .arr{font-size:1.2rem}
.home-ic{border:1px solid var(--bd);background:transparent;border-radius:12px;width:46px;height:46px;font-size:1.3rem;cursor:pointer;flex-shrink:0}
.lp{flex:1;height:8px;border-radius:9px;background:color-mix(in srgb,var(--acc) 15%,transparent);overflow:hidden}
.lp i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}

/* language chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.chip small{color:var(--mu);font-size:.75rem}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.chip.on small{color:var(--on);opacity:.75}
.fl{font-size:1.2rem}

/* hero — the one memorable piece: the word, set large like an engraving */
.hero{border:1px solid var(--bd);border-radius:var(--r2);padding:18px 18px 20px;background:var(--sf);margin-top:4px}
.hero-top{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
.streak{color:var(--acc);font-weight:700}
.wod{text-align:center;margin:14px 0 4px}
.wod-sub{display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:10px}
.tgt{font-family:var(--script);font-weight:500;unicode-bidi:isolate}
.tgt[lang=th-TH]{font-family:'Noto Serif Thai','Noto Sans Thai','Leelawadee UI',Tahoma,serif}
.tgt[lang=ar-SA]{font-family:'Noto Naskh Arabic','Traditional Arabic','Segoe UI',serif}
.tgt.xxl{font-size:5.2rem;line-height:1.15;color:var(--acc);display:block}
.tgt.xl{font-size:clamp(2.2rem,11vw,3.6rem);line-height:1.2;color:var(--acc);display:block;word-break:break-word}
.tgt.lg{font-size:1.65rem;line-height:1.3;display:block}
.tgt.md{font-size:1.25rem;line-height:1.35;display:block}
.tgt.sm{font-size:1.05rem}
.pr{color:var(--tx);font-weight:600}
.pr em{color:var(--mu);font-style:normal;font-weight:400;font-size:.85em}
.mn{color:var(--mu)}
.big{font-size:1.2rem}
.rule{border:0;height:1px;background:var(--bd);margin:16px 0 12px}
.lvl{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:6px}
.pbar{height:7px;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,transparent);overflow:hidden;margin:4px 0}
.pbar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.cta{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:60px;margin-top:14px;border:0;border-radius:16px;background:var(--acc);color:var(--on);font-weight:800;font-size:1.15rem;cursor:pointer;padding:10px 16px}
.cta small{font-weight:600;font-size:.82rem;opacity:.8}
.cta.slim{min-height:50px;font-size:1.02rem;margin:8px 0}
.cta:disabled{opacity:.6}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row.c{justify-content:center}
.row.wrap{flex-wrap:wrap}

/* home grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1px solid var(--bd);background:transparent;border-radius:var(--r);padding:14px;cursor:pointer;min-height:104px}
.tile span{font-size:1.5rem}
.tile b{font-size:1.05rem}
.tile small{color:var(--mu);font-size:.8rem;line-height:1.3}
.tile.wide{grid-column:span 2;flex-direction:row;align-items:center;gap:12px;min-height:70px}
.tile.wide small{display:block}
.tile.wide b{display:block}
.tile:hover,.trow:hover{border-color:var(--acc)}
.badge{text-align:center;color:var(--mu);font-size:.78rem;margin-top:26px;letter-spacing:.04em}
.warn{border:1px solid var(--no);color:var(--no);border-radius:12px;padding:10px 12px;font-size:.9rem}

/* letters */
.note{color:var(--mu);font-size:.95rem;margin:0 0 6px}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px}
.lt{aspect-ratio:1;border:1px solid var(--bd);border-radius:12px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.lt .tgt{font-size:1.6rem;line-height:1.1}
.lt small{font-size:.66rem;color:var(--mu);text-align:center;line-height:1.1;max-height:2.2em;overflow:hidden}
.lt.s{border-color:var(--acc)}
.lt.m{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:var(--acc)}
.legend{display:flex;gap:8px;align-items:center;color:var(--mu);font-size:.8rem;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--acc)}
.legend i.m{background:color-mix(in srgb,var(--acc) 30%,transparent)}
.ldet{text-align:center}

/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);background:transparent;border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:start;text-decoration:none;color:inherit;width:100%}
.trow:disabled{opacity:.45;cursor:default}
.ti{font-size:1.5rem;width:34px;text-align:center}
.tt{flex:1;display:flex;flex-direction:column}
.tt small{color:var(--mu);font-size:.82rem}
.items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.irow{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:var(--r);padding:12px;background:var(--sf);user-select:none}
.irow.m{border-inline-start:4px solid var(--acc)}
.itx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.itx .pr{font-size:.95rem}
.itx .mn{font-size:.88rem}
.iac{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:100px}
.iac .ic{min-width:40px;height:40px;font-size:1rem}
.fav{color:var(--mu)}
.fav.on{color:var(--acc);border-color:var(--acc)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--acc);background:transparent;color:var(--tx);border-radius:12px;min-height:46px;padding:8px 14px;cursor:pointer;text-decoration:none;font-weight:600}
.btn.gold{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.btn.red{border-color:var(--no);color:var(--no)}
.btn:disabled{opacity:.5}
.tag{font-size:.65rem;font-weight:800;border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-inline-start:4px;vertical-align:middle}
.empty,.hint{color:var(--mu);font-size:.92rem}
.tiny{color:var(--mu);font-size:.78rem}
.link{background:none;border:0;color:var(--acc);text-decoration:underline;cursor:pointer;padding:0}
h3{font-size:1.02rem;margin:20px 0 8px}

/* lesson */
.card{border:1px solid var(--bd);border-radius:var(--r2);background:var(--sf);padding:18px;margin-top:6px}
.card.intro,.card.sum,.card.result{text-align:center}
.new{display:inline-block;background:var(--acc);color:var(--on);font-weight:800;font-size:.75rem;border-radius:99px;padding:2px 10px;margin-bottom:6px}
.qh{color:var(--mu);margin:0 0 6px;text-align:center}
.prompt{text-align:center;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ask{font-size:1.5rem;font-weight:700;margin:0}
.listen{width:96px;height:96px;border-radius:50%;border:2px solid var(--acc);background:transparent;font-size:2.4rem;cursor:pointer}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{border:1px solid var(--bd);background:transparent;border-radius:14px;min-height:56px;padding:10px 14px;cursor:pointer;font-size:1.05rem;text-align:center}
.opt .tgt{color:var(--tx)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.wrong{border-color:var(--no);background:color-mix(in srgb,var(--no) 16%,transparent)}
.fb{margin-top:12px;padding:10px;border-radius:12px;text-align:center}
.fb.ok{color:var(--ok)}
.fb.no{color:var(--no)}
.fb .tgt,.fb .pr{color:var(--tx)}
.big-num{font-size:3.4rem;font-weight:800;color:var(--acc);margin:0}
.said{min-height:1.5em;margin:6px 0}
.said.ok{color:var(--ok)}
.said.no{color:var(--mu)}

/* speak */
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:8px 0}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;cursor:pointer;min-height:46px;display:flex;flex-direction:column;align-items:center;font-weight:600}
.seg button small{color:var(--mu);font-weight:400;font-size:.75rem}
.seg button.on{background:var(--acc);color:var(--on)}
.seg button.on small{color:var(--on);opacity:.75}
.fld{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.fld span{font-size:.9rem;color:var(--mu)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:48px;width:100%}
.fld textarea{resize:vertical;font-size:1.1rem}
input[type=range]{accent-color:var(--acc);padding:0!important;border:0!important;background:transparent!important}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{border:1px solid var(--bd);border-radius:var(--r);padding:12px;text-align:center}
.stats b{display:block;font-size:1.5rem;color:var(--acc)}
.stats small{color:var(--mu);font-size:.8rem}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;border:1px solid var(--bd);border-radius:var(--r);padding:12px 10px 8px}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.chart i{display:block;width:70%;min-height:2px;background:var(--acc);border-radius:6px 6px 2px 2px}
.chart small{font-size:.68rem;color:var(--mu)}
.chart b{font-size:.72rem}
.lvrow{display:grid;grid-template-columns:1fr auto;gap:0 8px;margin:8px 0}
.lvrow .pbar{grid-column:span 2}

/* settings */
.set h3{margin-top:0}
.sws{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin:6px 0}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;background:transparent;border:0;cursor:pointer;padding:4px;min-width:56px}
.sw i{width:44px;height:44px;border-radius:50%;border:3px solid transparent}
.sw.on i{border-color:var(--tx)}
.sw small{font-size:.7rem;color:var(--mu)}
.sw-gold i{background:linear-gradient(135deg,#000 50%,#D4AF37 50%)}
.sw-sapphire i{background:linear-gradient(135deg,#02060F 50%,#8FB4E8 50%)}
.sw-emerald i{background:linear-gradient(135deg,#010A06 50%,#4FC39A 50%)}
.sw-wine i{background:linear-gradient(135deg,#0A0205 50%,#E29AA8 50%)}
.sw-copper i{background:linear-gradient(135deg,#0A0502 50%,#E0955A 50%)}
.provs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.prov{border:1px solid var(--bd);background:transparent;border-radius:12px;padding:10px;cursor:pointer;display:flex;align-items:center;gap:4px;justify-content:center;min-height:48px}
.prov.on{border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.okd{color:var(--ok);font-style:normal;font-size:.7rem}
details{margin:6px 0}
summary{cursor:pointer;color:var(--acc);font-weight:600}
.diag{font-size:.72rem;white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:220px;overflow:auto;direction:ltr;text-align:left}
.danger{border-color:var(--no)}
.about{text-align:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mu)}
.kv dd{margin:0}

/* modal, big show, toasts */
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;background:var(--sf);border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:90vh;overflow:auto}
@media (min-width:700px){.modal-wrap{align-items:center}.modal{border-radius:22px}}
.modal .x{position:absolute;top:10px;inset-inline-end:10px;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:transparent;cursor:pointer}
.modal h3{margin-top:0;padding-inline-end:40px}
.cm{font-size:1.05rem;margin:10px 0 16px}
.guide{text-align:center}
.gstep{color:var(--mu);font-size:.8rem;margin:0}
.gic{font-size:3rem}
.bigshow{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.bigshow .x{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:12px;width:52px;height:52px;border-radius:50%;border:1px solid var(--bd);background:transparent;font-size:1.3rem;cursor:pointer}
.bs-in{max-width:95vw}
.bigshow .tgt{color:var(--acc);line-height:1.15;margin:0 0 18px;word-break:break-word}
.bigshow .pr{font-size:1.4rem;margin:0}
.bigshow .mn{font-size:1.1rem}
#toasts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:80;pointer-events:none;padding:0 14px}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;max-width:520px;font-size:.92rem;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:opacity .3s}
.toast.err{background:var(--no);color:#fff}
.toast.warn{border:2px solid var(--acc)}
.toast.out{opacity:0}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;color:#000;font-family:var(--ui)}
  #print table{width:100%;border-collapse:collapse;margin-bottom:16px}
  #print td{border:1px solid #999;padding:6px 8px;vertical-align:top}
  #print td.tgt{font-size:1.2rem}
}
/* v1.1 */
.search-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:1px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--mu);padding:0 16px;cursor:pointer;font-size:1rem;margin-bottom:10px;text-align:start}
.search-btn:hover{border-color:var(--acc)}
.search-btn span{flex:1}
.news{padding-inline-start:20px;margin:6px 0 14px}
.news li{margin:6px 0}

</style>
</head>
<body>
<a class="skip" href="#app">דלג לתוכן</a>
<main id="app"></main>
<div id="toasts"></div>
<div id="print"></div>
<script>
/* LingoNest v1.2.0 · © AppNest 2026 · Barak Aflalo */
/* ===== LingoNest — data.js : content (languages, alphabets, words, phrases) =====
   Adding a language later = add an entry to LANGS + ALPHA + WD. Nothing else changes. */

/* ===== LingoNest — app.js : engine, screens, speech, AI (BYOK), storage ===== */
'use strict';
const APP = { name: 'LingoNest', ver: '1.2.0' };
const MAXL = 9; /* levels: 1 letters · 2 survival · 3 travel vocab · 4 travel phrases · 5 everyday · 6 conversation · 7 world of words · 8 full sentences · 9 my words */

/* ---------- error log (last 10, shown in diagnostics) ---------- */
function logErr(m, f, l) {
  try {
    const a = JSON.parse(localStorage.getItem('ln_errs') || '[]');
    a.unshift({ m: String(m).slice(0, 200), f: String(f || '').split('/').pop(), l: l || 0, t: Date.now() });
    localStorage.setItem('ln_errs', JSON.stringify(a.slice(0, 10)));
  } catch (_) {}
}
addEventListener('error', e => logErr(e.message, e.filename, e.lineno));
addEventListener('unhandledrejection', e => logErr((e.reason && e.reason.message) || e.reason, 'promise', 0));

/* ---------- storage shim: localStorage → memory ---------- */
const S = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    ok,
    get(k, d) { try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) {
      const s = JSON.stringify(v);
      try { if (ok) localStorage.setItem(k, s); else mem[k] = s; return true; }
      catch (e) { mem[k] = s; toast(T('saveFail'), 'err', 5000); return false; }
    },
    del(k) { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch (e) {} }
  };
})();

/* ---------- state ---------- */
const DEF = {
  v: 1, user: '', ui: 'he', theme: 'gold', mode: 'night', lang: 'th', goal: 10, rate: 0.9, gender: 'm',
  voices: {}, onb: false, prog: {}, log: {}, newLog: {}, streak: { last: '', n: 0 }, phrases: [], custom: {},
  favs: {}, ai: { provider: 'gemini', model: '', has: {} }, backupAt: 0, firstUse: 0, seenVer: ''
};
let st = Object.assign({}, DEF, S.get('ln_state', {}));
st.ai = Object.assign({}, DEF.ai, st.ai || {});
if (!LANGS[st.lang]) st.lang = 'th';
if (!st.firstUse) st.firstUse = Date.now();
function save() { S.set('ln_state', st); }

/* ---------- i18n ---------- */
function T(k, vars) {
  let s = (LANG[st.ui] && LANG[st.ui][k]) || LANG.en[k] || k;
  if (vars) for (const v in vars) s = s.split('{' + v + '}').join(vars[v]);
  return s;
}
const isRTL = () => st.ui === 'he' || st.ui === 'ar';
const LN = l => LANGS[l].name[st.ui] || LANGS[l].name.en;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const dayKey = off => { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function toast(msg, kind, ms) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || '');
  el.setAttribute('role', 'status');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms || 2600);
}

/* ---------- content model ---------- */
function genderize(lang, s) {
  if (st.gender !== 'f' || !s || !GENDER_F[lang]) return s;
  return GENDER_F[lang].reduce((a, [re, to]) => a.replace(re, to), s);
}
let _itemsCache = {};
function items(lang) {
  const key = lang + st.gender + (st.custom[lang] || []).length + JSON.stringify((st.custom[lang] || []).map(c => c.id + c.text));
  if (_itemsCache[lang] && _itemsCache[lang].key === key) return _itemsCache[lang].list;
  const g = s => genderize(lang, s);
  const L = [];
  (ALPHA[lang] || []).forEach((a, i) => L.push({ k: 'L:' + i, type: 'L', lvl: 1, cat: 'letters', text: a[0], tts: a[1], heb: a[2], roman: a[3], he: a[2], en: a[3] }));
  (VOWELS[lang] || []).forEach((a, i) => L.push({ k: 'V:' + i, type: 'L', lvl: 1, cat: 'vowels', text: a[0], tts: a[1], heb: a[2], roman: a[3], he: a[2], en: a[3] }));
  CONCEPTS.forEach(c => {
    const t = WD[lang] && WD[lang][c[0]]; if (!t) return;
    L.push({ k: 'W:' + c[0], type: (c[1] === 'phr' || c[1] === 'conv' || c[1].startsWith('s_')) ? 'P' : 'W', lvl: c[2], cat: c[1], he: c[3], en: c[4], text: g(t[0]), roman: g(t[1]), heb: g(t[2]) });
  });
  (st.custom[lang] || []).forEach(c => L.push({ k: 'C:' + c.id, type: 'W', lvl: MAXL, cat: 'mine', he: c.he, en: c.he, text: c.text, roman: c.roman || '', heb: c.heb || '', cid: c.id }));
  _itemsCache[lang] = { key, list: L };
  return L;
}
const meaning = it => (st.ui === 'he' ? it.he : it.en) || it.he || it.en;
const pron = it => (st.ui === 'he' ? (it.heb || it.roman) : (it.roman || it.heb)) || '';

/* ---------- speech: recognition (say it) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\u064B-\u065F]/g, '').replace(/[^\p{L}\p{N}]/gu, ''); }
function sim(a, b) {
  if (!a || !b) return 0;
  if (a === b || a.includes(b) || b.includes(a)) return 1;
  const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return 1 - d[m][n] / Math.max(m, n);
}
function sayIt(it, lang, out, cb) {
  if (!SR) { toast(T('noSR'), 'warn', 5000); return; }
  if (location.protocol === 'file:') { toast(T('fileMic'), 'warn', 6000); return; }
  const r = new SR();
  r.lang = LANGS[lang].tts; r.maxAlternatives = 4; r.interimResults = false;
  if (out) out.textContent = T('listening');

    const target = norm(it.type === 'L' ? it.tts : it.text);
    const best = Math.max(...alts.map(a => sim(norm(a), target)));
    if (cb) cb(best >= 0.72, alts[0]);

  r.onend = () => { if (out && out.textContent === T('listening')) out.textContent = ''; };
  try { r.start(); } catch (e) { toast(T('srErr'), 'err'); }
}

/* ---------- IndexedDB (secrets) + AES-GCM key encryption ---------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const r = indexedDB.open('lingonest', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('secrets');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const s = db.transaction('secrets', mode).objectStore('secrets'); const q = fn(s); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  get(k) { return this.tx('readonly', s => s.get(k)); },
  put(k, v) { return this.tx('readwrite', s => s.put(v, k)); },
  del(k) { return this.tx('readwrite', s => s.delete(k)); },
  clear() { return this.tx('readwrite', s => s.clear()); }
};
const memKeys = {};
async function cryptoKey() {
  let k = await IDB.get('ck');
  if (!k) { k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']); await IDB.put('ck', k); }
  return k;
}
function cleanKey(k) { return String(k || '').split(/[,\n\r\s]+/).map(x => x.trim()).filter(Boolean)[0] || ''; }
async function setKey(provider, plain) {
  plain = cleanKey(plain);
  if (!plain) { delete memKeys[provider]; try { await IDB.del('ak_' + provider); } catch (e) {} st.ai.has[provider] = false; save(); return 'none'; }
  memKeys[provider] = plain; st.ai.has[provider] = true; save();
  try {
    const ck = await cryptoKey();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, ck, new TextEncoder().encode(plain));
    const back = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, ck, ct));
    if (back !== plain) throw new Error('verify');
    await IDB.put('ak_' + provider, { iv, ct });
    return 'enc';
  } catch (e) { return 'mem'; }
}
async function getKey(provider) {
  if (provider === 'local') return 'local';
  if (memKeys[provider]) return memKeys[provider];
  try {
    const r = await IDB.get('ak_' + provider);
    if (!r) return '';
    const ck = await cryptoKey();
    memKeys[provider] = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: r.iv }, ck, r.ct));
    return memKeys[provider];
  } catch (e) { return ''; }
}

const hdr = v => String(v).replace(/[^\x20-\x7E]/g, '');
async function httpJSON(url, opt) {

/* ===== SEARCH: how do you say…? ===== */
let SQ = '';
function searchResults(q) {
  const lang = st.lang, nq = norm(q);
  if (!nq) return [];
  const score = i => {
    const f = [i.he, i.en, i.text, i.roman, i.heb].map(norm);
    if (f.some(x => x === nq)) return 3;
    if (f.some(x => x.startsWith(nq))) return 2;
    if (f.some(x => x.includes(nq))) return 1;
    return 0;
  };
  return items(lang).filter(i => i.type !== 'L').map(i => [i, score(i)]).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 30).map(x => x[0]);
}
function searchListHTML() {
  const lang = st.lang, res = searchResults(SQ);
  if (!SQ.trim()) return '<p class="hint">' + esc(T('searchHint')) + '</p>';
  const miss = '<div class="card"><p>' + esc(T('searchNone', { q: SQ })) + '</p><button class="cta slim" data-act="searchToSpeak">✨ ' + esc(T('searchTranslate')) + (aiReady() ? '' : ' <span class="tag">PRO</span>') + '</button></div>';
  return res.length ? '<div class="items">' + res.map(i => rowHTML(i, lang, P(lang), st.favs[lang] || [])).join('') + '</div>' + (res.length < 3 ? miss : '') : miss;
}

/* ===== LESSON (session engine) ===== */
const LESSON = {
  q: [], i: 0, ok: 0, bad: 0, fresh: 0, answered: false, lang: 'th', listenOnly: false,
  start(scope) {
    const lang = this.lang = st.lang, p = P(lang), all = items(lang), now = Date.now();
    let q = [];
    this.listenOnly = scope === 'listen';
    this.sayMode = scope === 'say';
    if (scope === 'auto') {
      const cur = curLevel(lang);
      const due = all.filter(i => p[i.k] && p[i.k].d <= now && i.lvl <= cur + 1).sort((a, b) => p[a.k].d - p[b.k].d).slice(0, 15);
      let fresh = all.filter(i => !p[i.k] && i.lvl === cur).slice(0, Math.min(newLeft(), 7));
      if (!fresh.length && !due.length) fresh = all.filter(i => !p[i.k] && i.lvl <= cur + 1).slice(0, 5);
      q = fresh.map(it => ({ it, intro: true })).concat(shuffle(due.concat(fresh)).map(it => ({ it })));
      this.fresh = fresh.length;
    } else {
      let pool;
      if (scope === 'due') pool = all.filter(i => p[i.k] && p[i.k].d <= now);
      else if (scope === 'fav') pool = all.filter(i => (st.favs[lang] || []).includes(i.k));
      else if (scope === 'weak') pool = all.filter(i => p[i.k] && p[i.k].w > 0 && p[i.k].b <= 2);
      else if (scope === 'listen' || scope === 'say') pool = all.filter(i => i.type !== 'L' && (p[i.k] || i.lvl <= 2));
      else if (scope.startsWith('cat:')) pool = all.filter(i => i.cat === scope.slice(4));
      else pool = all.filter(i => i.type === scope);
      pool = shuffle(pool).slice(0, 10);
      q = pool.filter(it => !p[it.k] && scope !== 'listen' && scope !== 'say').map(it => ({ it, intro: true })).concat(pool.map(it => ({ it, kind: scope === 'say' ? 'SAY' : undefined })));
      this.fresh = pool.filter(it => !p[it.k]).length;
    }
    if (!q.length) { toast(T('nothingNow'), '', 3500); return; }
    if (this.fresh) { st.newLog[today()] = (st.newLog[today()] || 0) + this.fresh; save(); }
    Object.assign(this, { q, i: 0, ok: 0, bad: 0, answered: false });
    go('lesson');
  },
  makeQ(step) {
    const it = step.it, lang = this.lang;
    const same = items(lang).filter(x => x.type === it.type && x.k !== it.k && x.text !== it.text && meaning(x) !== meaning(it));
    const opts = shuffle(shuffle(same).slice(0, 3).concat([it]));
    let kind = step.kind;
    if (!kind) {
      kind = this.listenOnly ? 'A2T' : pick(it.type === 'L' ? ['T2S', 'S2T', 'A2T'] : ['T2M', 'M2T', 'A2T', 'T2M']);
      if (!('speechSynthesis' in window) && kind === 'A2T') kind = 'T2M';
      step.kind = kind; step.opts = opts;
    }
    return step;
  },
  paint() {
    const box = $('#lesson'); if (!box) return;
    const lang = this.lang;
    if (this.i >= this.q.length) { box.innerHTML = this.summary(); return; }
    const step = this.q[this.i], it = step.it;
    $('#lprog').style.width = Math.round(100 * this.i / this.q.length) + '%';
    if (step.intro) {
      const said = SR ? '<button class="btn" data-act="sayIt" data-k="' + it.k + '">🎤 ' + esc(T('sayIt')) + '</button>' : '';
      box.innerHTML = '<div class="card intro"><span class="new">' + esc(T('newItem')) + '</span>' + tgt(it, lang, it.type === 'P' ? 'lg' : 'xl') +
        '<p class="pr big">' + esc(pron(it)) + (pron2(it) ? ' <em>' + esc(pron2(it)) + '</em>' : '') + '</p><p class="mn big">' + esc(it.type === 'L' ? T('soundsLike') + ' ' + (st.ui === 'he' ? it.heb : it.roman) : meaning(it)) + '</p>' +
        '<div class="row c">' + soundBtns(it.k) + said + '</div><p class="said" id="said" aria-live="polite"></p>' +
        '<button class="cta" data-act="lnext">' + esc(T('gotIt')) + '</button></div>';
      setTimeout(() => speak(ttsText(it), lang), 250);
      return;
    }
    if (step.kind === 'SAY') {
      box.innerHTML = '<div class="card intro"><p class="qh">' + esc(T('qSAY')) + '</p><p class="ask">' + esc(meaning(it)) + '</p>' + tgt(it, lang, it.type === 'P' ? 'lg' : 'xl') +
        '<p class="pr big">' + esc(pron(it)) + '</p><div class="row c">' + soundBtns(it.k) + '</div>' +
        '<button class="listen" data-act="saySession" aria-label="' + esc(T('sayIt')) + '">🎤</button><p class="said" id="said" aria-live="polite"></p>' +
        '<div id="fb" aria-live="polite"><button class="btn" data-act="sayGrade" data-ok="0">' + esc(T('skipIt')) + '</button></div></div>';
      this.answered = false;
      return;
    }
    this.makeQ(step);
    const k = step.kind;
    let prompt = '';
    if (k === 'T2M' || k === 'T2S') prompt = tgt(it, lang, it.type === 'P' ? 'lg' : 'xl');
    else if (k === 'M2T') prompt = '<p class="ask">' + esc(meaning(it)) + '</p>';
    else if (k === 'S2T') prompt = '<p class="ask">' + esc(T('whichLetter')) + '</p><p class="ask big">' + esc(st.ui === 'he' ? it.heb : it.roman) + '</p>';
    else prompt = '<button class="listen" data-act="say" data-k="' + it.k + '" aria-label="' + esc(T('listen')) + '">🔊</button><button class="ic" data-act="say" data-slow="1" data-k="' + it.k + '">🐢</button>';
    const q = { T2M: 'qT2M', M2T: 'qM2T', A2T: 'qA2T', T2S: 'qT2S', S2T: 'qS2T' }[k];
    const showsTarget = k === 'M2T' || k === 'A2T' || k === 'S2T';
    const opts = step.opts.map((o, n) => '<button class="opt" data-act="answer" data-n="' + n + '">' +
      (showsTarget ? tgt(o, lang, 'md') : esc(k === 'T2S' ? (st.ui === 'he' ? o.heb : o.roman) : meaning(o))) + '</button>').join('');
    box.innerHTML = '<div class="card"><p class="qh">' + esc(T(q)) + '</p><div class="prompt">' + prompt + '</div><div class="opts">' + opts + '</div><div id="fb" aria-live="polite"></div></div>';
    this.answered = false;
    if (k === 'A2T') setTimeout(() => speak(ttsText(it), lang), 250);
  },
  answer(n) {
    if (this.answered) return;
    this.answered = true;
    const step = this.q[this.i], it = step.it, chosen = step.opts[n], good = chosen.k === it.k;
    grade(this.lang, it.k, good);
    good ? this.ok++ : this.bad++;
    document.querySelectorAll('.opt').forEach((b, j) => {
      b.disabled = true;
      if (step.opts[j].k === it.k) b.classList.add('right'); else if (j === n) b.classList.add('wrong');
    });
    if (!good && !step.retry) this.q.push({ it, retry: true });
    try { navigator.vibrate && navigator.vibrate(good ? 20 : [40, 40, 40]); } catch (e) {}
    const fb = $('#fb');
    fb.innerHTML = '<div class="fb ' + (good ? 'ok' : 'no') + '"><b>' + esc(good ? T('right') : T('wrongWas')) + '</b> ' + tgt(it, this.lang, 'sm') + ' · <span class="pr">' + esc(pron(it)) + '</span> · ' + esc(it.type === 'L' ? (st.ui === 'he' ? it.heb : it.roman) : meaning(it)) + '</div><button class="cta" data-act="lnext">' + esc(T('next')) + '</button>';
    speak(ttsText(it), this.lang);
    const nb = fb.querySelector('.cta'); if (nb) nb.focus();
  },
  sayGrade(ok) {
    if (this.answered) return;
    this.answered = true;
    const it = this.q[this.i].it;
    grade(this.lang, it.k, ok);
    ok ? this.ok++ : this.bad++;
    $('#fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><b>' + esc(ok ? T('saidGood') : T('sayMore')) + '</b></div><button class="cta" data-act="lnext">' + esc(T('next')) + '</button>';
    const nb = $('#fb .cta'); if (nb) nb.focus();
  },
  next() { this.i++; this.paint(); },
  summary() {
    $('#lprog').style.width = '100%';
    const tot = this.ok + this.bad, pct = tot ? Math.round(100 * this.ok / tot) : 100;
    return '<div class="card sum"><p class="big-num">' + pct + '%</p><p>' + esc(T('sumLine', { ok: this.ok, t: tot })) + '</p>' +
      (this.fresh ? '<p>' + esc(T('sumNew', { n: this.fresh })) + '</p>' : '') + '<p>🔥 ' + esc(T('streakN', { n: st.streak.n })) + '</p>' +
      '<div class="row c wrap"><button class="cta" data-act="startAuto">▶ ' + esc(T('another')) + '</button><button class="btn" data-act="home">⌂ ' + esc(T('home')) + '</button></div></div>';
  }
};

/* ---------- modal / overlays ---------- */
let lastFocus = null;
function modal(html, cls) {
  closeModal();
  lastFocus = document.activeElement;
  const w = document.createElement('div');
  w.className = 'modal-wrap'; w.id = 'modal';
  w.innerHTML = '<div class="modal ' + (cls || '') + '" role="dialog" aria-modal="true"><button class="x" data-act="closeModal" aria-label="' + esc(T('close')) + '">✕</button>' + html + '</div>';
  w.addEventListener('click', e => { if (e.target === w) closeModal(); });
  document.body.appendChild(w);
  const f = w.querySelector('input,textarea,select,button:not(.x)') || w.querySelector('.x'); if (f) f.focus();
}
function closeModal() { const m = $('#modal'); if (m) { m.remove(); if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} } }
function confirmBox(msg, okLabel, cb, danger) {
  modal('<p class="cm">' + esc(msg) + '</p><div class="row c wrap"><button class="btn ' + (danger ? 'red' : 'gold') + '" id="cmOk">' + esc(okLabel) + '</button><button class="btn" data-act="closeModal">' + esc(T('cancel')) + '</button></div>');
  $('#cmOk').onclick = () => { closeModal(); cb(); };
}

/* ---------- export / import / print ---------- */
function download(name, data, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const stamp = () => today();
function exportJson() {
  const data = { app: APP.name, ver: APP.ver, user: st.user, date: new Date().toISOString(), secretsIncluded: false, state: Object.assign({}, st, { ai: { provider: st.ai.provider, model: st.ai.model, has: {} } }) };
  download('lingonest-safe-backup-' + stamp() + '.json', JSON.stringify(data, null, 1), 'application/json');
  st.backupAt = Date.now(); save(); toast(T('exported'));
}
function importJson(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || !j.state || j.app !== APP.name) throw new Error('format');
      confirmBox(T('confirmRestore', { d: (j.date || '').slice(0, 10), u: j.user || '—' }), T('restore'), () => {
        const keepHas = st.ai.has;
        st = Object.assign({}, DEF, j.state); st.ai = Object.assign({}, DEF.ai, j.state.ai || {}, { has: keepHas });
        _itemsCache = {}; save(); go('home'); toast(T('restored'));
      }, true);
    } catch (e) { toast(T('badFile'), 'err', 4000); }
  };
  r.readAsText(file);
}
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv() {
  const rows = [[T('userName') + ': ' + (st.user || '—'), T('date') + ': ' + stamp()], [], ['lang', 'level', 'category', 'text', 'pronunciation', 'meaning', 'box', 'correct', 'wrong']];
  Object.keys(LANGS).forEach(l => { const p = P(l); items(l).forEach(i => { const r = p[i.k] || {}; rows.push([l, i.lvl, i.cat, i.text, i.heb || i.roman, i.type === 'L' ? i.roman : i.he, r.b || 0, r.c || 0, r.w || 0]); }); });
  rows.push([], [T('myPhrases')], ['lang', 'source', 'text', 'pronunciation']);
  st.phrases.forEach(x => rows.push([x.lang, x.src, x.text, x.heb || x.roman]));
  download('lingonest-' + stamp() + '.csv', '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  toast(T('exported'));
}

  const lang = st.lang;
  const mine = st.phrases.filter(x => x.lang === lang);
  const base = items(lang).filter(i => i.type === 'P');
  const row = (a, b, c) => '<tr><td class="tgt" lang="' + LANGS[lang].tts + '" dir="' + LANGS[lang].dir + '">' + esc(a) + '</td><td>' + esc(b) + '</td><td>' + esc(c) + '</td></tr>';
  $('#print').innerHTML = '<h1>' + esc(T('phrasebook')) + ' · ' + esc(LN(lang)) + '</h1><p>' + esc((st.user ? st.user + ' · ' : '') + stamp()) + ' · ' + APP.name + '</p>' +
    (mine.length ? '<h2>' + esc(T('myPhrases')) + '</h2><table>' + mine.map(x => row(x.text, x.heb || x.roman, x.src)).join('') + '</table>' : '') +
    '<h2>' + esc(T('phrases')) + '</h2><table>' + base.map(i => row(i.text, pron(i), meaning(i))).join('') + '</table>';
  setTimeout(() => window.print(), 100);
}

/* ---------- onboarding guide ---------- */
function guide(step) {
  step = step || 0;
  const S5 = [['👋', 'g1t', 'g1b'], ['🌍', 'g2t', 'g2b'], ['🪜', 'g3t', 'g3b'], ['📢', 'g4t', 'g4b'], ['🔊', 'g5t', 'g5b']];
  const [ic, t, b] = S5[step];
  const langPick = step === 1 ? '<div class="chips wrap">' + Object.keys(LANGS).map(l => '<button class="chip' + (st.lang === l ? ' on' : '') + '" data-act="gLang" data-l="' + l + '"><span class="fl">' + LANGS[l].flag + '</span><span>' + esc(LN(l)) + '</span></button>').join('') + '</div>' : '';
  const nameIn = step === 4 ? '<label class="fld"><span>' + esc(T('userName')) + '</span><input id="gName" value="' + esc(st.user) + '" maxlength="40"></label>' : '';
  modal('<div class="guide"><p class="gstep">' + (step + 1) + ' / 5</p><div class="gic">' + ic + '</div><h3>' + esc(T(t)) + '</h3><p>' + esc(T(b)) + '</p>' + langPick + nameIn +
    '<div class="row c wrap">' + (step < 4 ? '<button class="cta slim" id="gNext">' + esc(T('next')) + '</button><button class="btn" id="gSkip">' + esc(T('skip')) + '</button>' : '<button class="cta slim" id="gDone">' + esc(T('start')) + '</button>') + '</div></div>');
  const done = () => { const n = $('#gName'); if (n) st.user = n.value.trim(); st.onb = true; save(); closeModal(); render(); };
  if ($('#gNext')) $('#gNext').onclick = () => guide(step + 1);
  if ($('#gSkip')) $('#gSkip').onclick = done;
  if ($('#gDone')) $('#gDone').onclick = done;
}

/* ---------- actions (event delegation) ---------- */
const ACT = {
  back, home: () => go('home'), closeModal,
  nav: d => go(d.to, d.sec || d.arg || null),
  setLang: d => { st.lang = d.l; save(); render(); },
  gLang: d => { st.lang = d.l; save(); document.querySelectorAll('[data-act=gLang]').forEach(b => b.classList.toggle('on', b.dataset.l === d.l)); },
  themeSheet,
  setTheme: d => { st.theme = d.t; save(); applyTheme(); document.querySelectorAll('.sw').forEach(b => { b.classList.toggle('on', b.dataset.t === d.t); b.setAttribute('aria-pressed', b.dataset.t === d.t); }); },
  setMode: d => { st.mode = d.m; save(); applyTheme(); document.querySelectorAll('[data-act=setMode]').forEach(b => b.classList.toggle('on', b.dataset.m === d.m)); },
  setGoal: d => { st.goal = +d.n; save(); render(); },
  setGender: d => { st.gender = d.g; _itemsCache = {}; save(); render(); },
  say: d => { const it = findItem(st.lang, d.k) || findItem(LESSON.lang, d.k); if (it) speak(ttsText(it), st.lang, !!d.slow); },
  big: d => { const it = findItem(st.lang, d.k); if (it) bigShow(it.text, st.lang, pron(it), it.type === 'L' ? '' : meaning(it)); },
  fav: (d, el) => { const f = st.favs[st.lang] = st.favs[st.lang] || []; const i = f.indexOf(d.k); if (i >= 0) f.splice(i, 1); else f.push(d.k); save(); el.classList.toggle('on', i < 0); el.setAttribute('aria-pressed', i < 0); },
  letter: d => {
    const it = findItem(st.lang, d.k), r = P(st.lang)[d.k];
    modal('<div class="ldet">' + tgt(it, st.lang, 'xxl') + '<p class="pr big">' + esc(it.tts) + '</p><p class="mn big">' + esc(T('soundsLike')) + ' ' + esc(st.ui === 'he' ? it.heb : it.roman) + '</p>' +
      (st.ui === 'he' ? '<p class="tiny">' + esc(it.roman) + '</p>' : '') + '<div class="row c">' + soundBtns(it.k) + (SR ? '<button class="btn" data-act="sayIt" data-k="' + it.k + '">🎤 ' + esc(T('sayIt')) + '</button>' : '') + '</div><p class="said" id="said" aria-live="polite"></p>' +
      '<p class="tiny">' + esc(r ? T('boxInfo', { b: r.b, c: r.c, w: r.w }) : T('notYet')) + '</p></div>');
    speak(it.tts, st.lang);
  },
  sayIt: d => { const it = findItem(st.lang, d.k); if (it) sayIt(it, st.lang, $('#said')); },
  sayRaw: d => speak(d.t, st.lang, !!d.slow),
  saySession: () => { const s = LESSON.q[LESSON.i]; if (s && !LESSON.answered) sayIt(s.it, LESSON.lang, $('#said'), ok => { if (ok) LESSON.sayGrade(true); }); },
  sayGrade: d => LESSON.sayGrade(d.ok === '1'),
  searchToSpeak: () => { SPK.src = SQ; SPK.direct = false; SPK.res = null; go('speak'); },
  whatsNew: () => whatsNew(),
  startAuto: () => LESSON.start('auto'),
  startScope: d => LESSON.start(d.scope),
  answer: d => LESSON.answer(+d.n),
  lnext: () => LESSON.next(),
  addCustom: () => customForm(null),
  editCustom: d => customForm((st.custom[st.lang] || []).find(x => x.id === d.id)),
  aiWords: aiWordsForm,
  spkMode: d => { SPK.src = ($('#spkIn') || {}).value || SPK.src; SPK.direct = d.v === '1'; SPK.res = null; render(); },
  spkDirect: () => { const v = $('#spkIn').value.trim(); if (!v) { toast(T('typeFirst'), 'warn'); return; } SPK.src = v; SPK.res = { text: v, roman: '', heb: '', back: '', src: v }; render(); speak(v, st.lang); },
  spkTranslate: async (d, el) => {
    const v = $('#spkIn').value.trim(); if (!v) { toast(T('typeFirst'), 'warn'); return; }
    SPK.src = v;
    if (!aiReady()) { toast(T('needAi'), 'warn', 4500); render(); return; }
    el.disabled = true; el.innerHTML = '⏳ ' + esc(T('working'));
    try {
      const r = await aiTranslate(v, st.lang);
      if (!r || !r.text) throw new Error(T('aiBadJson'));
      SPK.res = { text: String(r.text), roman: String(r.roman || ''), heb: String(r.heb || ''), back: String(r.back || ''), src: v, ai: true };
      render(); speak(SPK.res.text, st.lang);
    } catch (e) { el.disabled = false; el.innerHTML = '✨ ' + esc(T('translate')); toast(T('aiErr') + ': ' + e.message, 'err', 6000); }
  },
  gtLink: () => { const v = $('#spkIn'); if (v) SPK.src = v.value; },
  spkSay: d => SPK.res && speak(SPK.res.text, st.lang, !!d.slow),
  spkBig: () => SPK.res && bigShow(SPK.res.text, st.lang, st.ui === 'he' ? (SPK.res.heb || SPK.res.roman) : (SPK.res.roman || SPK.res.heb), SPK.res.src),
  spkSave: () => {
    if (!SPK.res) return;
    st.phrases.unshift({ id: uid(), lang: st.lang, src: SPK.res.src, text: SPK.res.text, roman: SPK.res.roman, heb: SPK.res.heb, ts: Date.now() });
    save(); SPK.res = null; SPK.src = ''; render(); toast(T('saved'));
  },
  phSay: d => { const x = st.phrases.find(p => p.id === d.id); if (x) speak(x.text, x.lang); },
  phBig: d => { const x = st.phrases.find(p => p.id === d.id); if (x) bigShow(x.text, x.lang, st.ui === 'he' ? (x.heb || x.roman) : (x.roman || x.heb), x.src); },
  phEdit: d => { const x = st.phrases.find(p => p.id === d.id); if (x) phraseForm(x); },
  printBook,
  testVoice: () => { const it = items(st.lang).find(i => i.k === 'W:hello'); speak(it ? it.text : 'Hello', st.lang); },
  setProv: d => { st.ai.provider = d.p; st.ai.model = ''; save(); render(); },
  saveKey: async () => {
    const v = $('#aiKey').value; if (!cleanKey(v)) { toast(T('keyEmpty'), 'warn'); return; }
    const r = await setKey(st.ai.provider, v);
    toast(r === 'enc' ? T('keyEnc') : T('keyMem'), r === 'enc' ? '' : 'warn', 4500); render();
  },
  disconnect: () => confirmBox(T('confirmDisconnect'), T('disconnect'), async () => { await setKey(st.ai.provider, ''); render(); toast(T('disconnected')); }),
  refreshModels: async (d, el) => {
    el.disabled = true;
    try { const list = await liveModels(); st.ai.live = st.ai.live || {}; st.ai.live[st.ai.provider] = list.slice(0, 40); save(); render(); toast(T('modelsN', { n: list.length })); }
    catch (e) { el.disabled = false; toast(T('aiErr') + ': ' + e.message, 'err', 6000); }
  },
  testAi: async (d, el) => {
    el.disabled = true; el.textContent = '⏳ ' + T('working');
    try { const r = await aiTranslate('תודה רבה', 'en'); if (!r.text) throw new Error(T('aiBadJson')); toast('✅ ' + T('aiOk') + ' — ' + r.text, '', 4000); }
    catch (e) { toast(T('aiErr') + ': ' + e.message, 'err', 7000); }
    render();
  },
  exportJson, exportCsv,
  guide: () => guide(0),
  copyDiag: () => { const t = diagText(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(T('copied')), () => toast(T('copyFail'), 'warn')); },
  resetAll: () => confirmBox(T('reset1'), T('continueBtn'), () => confirmBox(T('reset2'), T('resetAll'), async () => {
    try { await IDB.clear(); } catch (e) {}
    ['ln_state', 'ln_errs'].forEach(k => S.del(k));
    try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
    location.reload();
  }, true), true),
  shareApp: async () => {
    const data = { title: APP.name, text: T('shareText', { u: st.user || '' }), url: location.href.split('#')[0] };
    try { if (navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(data.url); toast(T('linkCopied')); } } catch (e) {}
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = ACT[el.dataset.act];
  if (!a) return;
  if (el.tagName === 'A' && el.dataset.act !== 'gtLink') e.preventDefault();
  a(el.dataset, el, e);
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.ch; if (!k) return;
  const v = e.target.value;
  if (k === 'ui') { st.ui = v; save(); render(); }
  else if (k === 'voice') { st.voices[st.lang] = v; save(); render(); speak((findItem(st.lang, 'W:hello') || {}).text || 'Hello', st.lang); }
  else if (k === 'model') { st.ai.model = v; save(); }
  else if (k === 'import') { if (e.target.files[0]) importJson(e.target.files[0]); e.target.value = ''; }
  else if (k === 'user') { st.user = v.trim(); save(); }
  else if (k === 'rate') { st.rate = +v; save(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.ch;
  if (k === 'rate') { const r = $('#rateV'); if (r) r.textContent = (+e.target.value).toFixed(2); }
  if (k === 'user') { st.user = e.target.value.trim(); save(); }
  if (e.target.id === 'spkIn') SPK.src = e.target.value;
  if (e.target.id === 'sIn') { SQ = e.target.value; const r = $('#sRes'); if (r) r.innerHTML = searchListHTML(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const b = $('#bigshow'); if (b) { b.remove(); return; } if ($('#modal')) { closeModal(); return; } }
  if (e.key === 'Tab' && $('#modal')) {
    const f = [...$('#modal').querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
  if (NAV.cur === 'lesson' && !$('#modal') && /^[1-4]$/.test(e.key)) { const b = document.querySelectorAll('.opt')[+e.key - 1]; if (b && !b.disabled) b.click(); }
});
/* long press → edit (phrases, custom words) */
let lpT = null;
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('[data-lp]'); if (!row || e.target.closest('button')) return;
  lpT = setTimeout(() => {
    lpT = null;
    if (row.dataset.lp === 'phrase') ACT.phEdit({ id: row.dataset.id });
    else ACT.editCustom({ id: row.dataset.id });
    try { navigator.vibrate && navigator.vibrate(15); } catch (_) {}
  }, 550);
});
['pointerup', 'pointerleave', 'pointercancel', 'scroll'].forEach(ev => document.addEventListener(ev, () => { if (lpT) { clearTimeout(lpT); lpT = null; } }, true));

/* ---------- what's new ---------- */
function whatsNew() {
  modal('<h3>✨ ' + esc(T('newIn', { v: APP.ver })) + '</h3><ul class="news">' + ['wn1', 'wn2', 'wn3', 'wn4', 'wn5'].map(k => '<li>' + esc(T(k)) + '</li>').join('') + '</ul><button class="cta slim" data-act="closeModal">' + esc(T('gotIt')) + '</button>');
}

/* ---------- boot ---------- */
function boot() {
  applyTheme();
  render();
  const firstRun = !st.onb;
  if (st.seenVer !== APP.ver) { const had = !!st.seenVer || Object.keys(st.log).length > 0; st.seenVer = APP.ver; save(); if (!firstRun && had) setTimeout(whatsNew, 400); }
  if (firstRun) setTimeout(() => guide(0), 300);
  else if (st.backupAt && Date.now() - st.backupAt > 30 * 864e5 && Object.keys(st.log).length > 5) setTimeout(() => toast(T('backupNudge'), '', 5000), 1500);
  else if (!st.backupAt && Date.now() - st.firstUse > 14 * 864e5) setTimeout(() => toast(T('backupNudge'), '', 5000), 1500);
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(e => logErr('sw: ' + e.message, 'sw', 0));
}
window.__MODS = window.__MODS || {}; window.__MODS.app = 1;

boot();
</script>
